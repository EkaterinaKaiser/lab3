name: Lab

on:
  push:
    branches: [ main ]

jobs:
  deploy-cloud:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.CLOUD_USER }}@${{ secrets.CLOUD_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CLOUD_SSH_KEY }}

      - name: Install docker-compose
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'curl -L "https://github.com/docker/compose/releases/download/v2.26.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose'
          ssh -o StrictHostKeyChecking=no "$HOST" 'chmod +x /usr/local/bin/docker-compose'

      - name: Copy files
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.yml deploy.sh suricata/suricata.yaml smb.conf "$HOST:"

      - name: Validate docker-compose.yml
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker-compose -f docker-compose.yml config --quiet'

      - name: Stop containers
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker-compose -f docker-compose.yml down -v --remove-orphans || true'

      - name: Run deployment script
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'bash deploy.sh'
          sleep 10

      - name: Start containers
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker-compose -f docker-compose.yml up -d'

      - name: Install dependencies in attacker container
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker exec attacker apt update -qq'
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker exec attacker apt install -y vim nmap jq metasploit-framework netcat-traditional telnet smbclient redis-tools python3-pip python3.13-venv curl wget python3 python3-pip awscli openssh-client hydra python2.7 python2.7-dev git gcc file openjdk-11-jre'
          sleep 5

      - name: Copy test files
        run: |
          scp -o StrictHostKeyChecking=no test1.sh test2.sh test3.sh poc.py poc.xml redis_attack.py minio_cve_exploit.py "$HOST:"

      # - name: Run attack simulation test (ActiveMQ)
      #   run: |
      #     ssh -o StrictHostKeyChecking=no "$HOST" 'chmod +x test1.sh && bash test1.sh'

      # - name: Run Redis attack test
      #   run: |
      #     ssh -o StrictHostKeyChecking=no "$HOST" 'chmod +x test2.sh && bash test2.sh'

      - name: Run MinIO CVE-2023-28432 exploit test
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'chmod +x test3.sh && bash test3.sh'

      - name: Display EveBox credentials
        run: |
          echo "=========================================="
          echo "EveBox Access Information"
          echo "=========================================="
          echo ""
          echo "EveBox URL: http://${{ secrets.CLOUD_HOST }}:5636/"
          echo ""
          echo "Searching for credentials in EveBox logs..."
          CREDS=$(ssh -o StrictHostKeyChecking=no "$HOST" 'sudo journalctl -u evebox --no-pager | grep -i "Created administrator\|username.*password" | tail -1' || echo "")
          if [ -n "$CREDS" ]; then
            echo "$CREDS"
          else
            echo "No credentials found in logs."
            echo "EveBox may be running without authentication (check deploy.sh configuration)."
            echo "Or credentials may have been created earlier. Check logs manually:"
            echo "  sudo journalctl -u evebox | grep -i 'username\|password\|Created administrator'"
          fi
          echo ""
          echo "To access EveBox, open: http://${{ secrets.CLOUD_HOST }}:5636/"
          echo "=========================================="

     # - name: Test Suricata
     #   run: |
     #     ssh -o StrictHostKeyChecking=no "$HOST" 'bash test-suricata.sh'
