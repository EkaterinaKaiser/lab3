name: Lab

on:
  push:
    branches: [ main ]

jobs:
  deploy-cloud:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.CLOUD_USER }}@${{ secrets.CLOUD_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CLOUD_SSH_KEY }}

      - name: Install docker-compose
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'curl -L "https://github.com/docker/compose/releases/download/v2.26.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose'
          ssh -o StrictHostKeyChecking=no "$HOST" 'chmod +x /usr/local/bin/docker-compose'

      - name: Copy files
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.yml deploy.sh suricata/suricata.yaml smb.conf "$HOST:"
          scp -r -o StrictHostKeyChecking=no nginx_html apache_html "$HOST:" || true

      - name: Validate docker-compose.yml
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker-compose -f docker-compose.yml config --quiet'

      - name: Stop containers
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker-compose -f docker-compose.yml down -v --remove-orphans || true'

      - name: Run deployment script
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'bash deploy.sh'
          sleep 10

      - name: Start containers
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker-compose -f docker-compose.yml up -d'

      - name: Install dependencies in attacker container
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker exec attacker apt update -qq'
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker exec attacker apt install -y vim nmap jq metasploit-framework netcat-traditional telnet smbclient redis-tools python3-pip python3.13-venv curl wget python3 python3-pip awscli openssh-client hydra python2.7 python2.7-dev git gcc file openjdk-11-jre'
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker exec attacker python3 -m venv /venv'
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker exec attacker /venv/bin/pip install requests'
          sleep 5

      - name: Copy test files
        run: |
          scp -o StrictHostKeyChecking=no test1.sh test2.sh test3.sh test4.sh test5.sh poc.py poc.xml poc6.py redis_attack.py minio_cve_exploit.py jenkins_exploit.py "$HOST:"

      - name: Copy poc6.py to attacker container
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker cp poc6.py attacker:/poc6.py'
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker exec attacker chmod +x /poc6.py'

      # - name: Run attack simulation test (ActiveMQ)
      #   run: |
      #     ssh -o StrictHostKeyChecking=no "$HOST" 'chmod +x test1.sh && bash test1.sh'

      # - name: Run Redis attack test
      #   run: |
      #     ssh -o StrictHostKeyChecking=no "$HOST" 'chmod +x test2.sh && bash test2.sh'

      # - name: Run MinIO CVE-2023-28432 exploit test
      #   run: |
      #     ssh -o StrictHostKeyChecking=no "$HOST" 'chmod +x test3.sh && bash test3.sh'

      # - name: Run SambaCry CVE-2017-7494 exploit test
      #   run: |
      #     ssh -o StrictHostKeyChecking=no "$HOST" 'chmod +x test4.sh && bash test4.sh'

      # - name: Run Jenkins CVE-2024-23897 exploit test
      #   run: |
      #     ssh -o StrictHostKeyChecking=no "$HOST" 'chmod +x test5.sh && bash test5.sh'

      - name: Display EveBox access information
        run: |
          echo ""
          echo "=========================================="
          echo "🔐 EveBox Access Information"
          echo "=========================================="
          echo ""
          EVEBOX_URL="http://${{ secrets.CLOUD_HOST }}:5636/"
          echo "📍 EveBox URL: $EVEBOX_URL"
          echo ""
          
          # Проверка статуса EveBox и поиск учетных данных
          echo "Checking EveBox status and authentication..."
          EVEBOX_STATUS=$(ssh -o StrictHostKeyChecking=no "$HOST" 'sudo systemctl is-active evebox 2>/dev/null || echo "inactive"')
          
          if [ "$EVEBOX_STATUS" = "active" ]; then
            echo "✓ EveBox is running"
            echo ""
            
            # Поиск учетных данных в логах (проверяем все логи, не только последние)
            echo "Searching for credentials in EveBox logs..."
            CREDS=$(ssh -o StrictHostKeyChecking=no "$HOST" 'sudo journalctl -u evebox --no-pager | grep -i "Created administrator\|username.*password\|username=.*password=" | tail -1' || echo "")
            
            if [ -n "$CREDS" ]; then
              echo ""
              echo "✅ CREDENTIALS FOUND:"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              # Извлекаем username и password из лога
              USERNAME=$(echo "$CREDS" | grep -oP 'username=\K[^,\s}]+' || echo "")
              PASSWORD=$(echo "$CREDS" | grep -oP 'password=\K[^,\s}]+' || echo "")
              
              if [ -n "$USERNAME" ] && [ -n "$PASSWORD" ]; then
                echo "  👤 Username: $USERNAME"
                echo "  🔑 Password: $PASSWORD"
              else
                echo "$CREDS"
              fi
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo ""
              echo "📝 To access EveBox:"
              echo "   1. Open: $EVEBOX_URL"
              echo "   2. Enter the username and password above"
            else
              echo ""
              echo "ℹ️  No credentials found in logs."
              echo ""
              echo "This means authentication is likely DISABLED."
              echo ""
              echo "📝 To access EveBox:"
              echo "   → Simply open the URL in your browser: $EVEBOX_URL"
              echo "   → No login required!"
              echo ""
              echo "If you see a login page, credentials may have been created earlier."
              echo "Check full logs on server: sudo journalctl -u evebox | grep -i 'username\|password'"
            fi
          else
            echo "⚠️  EveBox is not running (status: $EVEBOX_STATUS)"
            echo "   Check server logs for issues"
          fi
          
          echo ""
          echo "=========================================="
          echo "🔗 Direct Link: $EVEBOX_URL"
          echo "=========================================="
          echo ""

      - name: Run poc6.py exploit
        run: |
          echo "=== Запуск poc6.py для эксплуатации CVE-2017-7529 (Nginx) ==="
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker exec attacker /venv/bin/python3 /poc6.py http://172.20.0.106:80/'

     # - name: Test Suricata
     #   run: |
     #     ssh -o StrictHostKeyChecking=no "$HOST" 'bash test-suricata.sh'
