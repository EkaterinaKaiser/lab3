name: Lab

on:
  push:
    branches: [ main ]

jobs:
  deploy-cloud:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.CLOUD_USER }}@${{ secrets.CLOUD_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CLOUD_SSH_KEY }}

      - name: Install docker-compose
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'curl -L "https://github.com/docker/compose/releases/download/v2.26.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose'
          ssh -o StrictHostKeyChecking=no "$HOST" 'chmod +x /usr/local/bin/docker-compose'

      - name: Copy files
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.yml deploy.sh suricata/suricata.yaml smb.conf "$HOST:"
          scp -r -o StrictHostKeyChecking=no nginx_html apache_html "$HOST:" || true

      - name: Validate docker-compose.yml
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker-compose -f docker-compose.yml config --quiet'

      - name: Stop containers
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker-compose -f docker-compose.yml down -v --remove-orphans || true'

      - name: Run deployment script
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'bash deploy.sh'
          sleep 10

      - name: Start containers
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker-compose -f docker-compose.yml up -d'

      - name: Install dependencies in attacker container
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker exec attacker apt update -qq'
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker exec attacker apt install -y vim nmap jq metasploit-framework netcat-traditional telnet smbclient redis-tools python3-pip python3.13-venv curl wget python3 python3-pip awscli openssh-client hydra python2.7 python2.7-dev git gcc file openjdk-11-jre'
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker exec attacker python3 -m venv /venv'
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker exec attacker /venv/bin/pip install requests'
          sleep 5

      - name: Copy test files
        run: |
          scp -o StrictHostKeyChecking=no test1.sh test2.sh test3.sh test4.sh test5.sh poc.py poc.xml poc6.py redis_attack.py minio_cve_exploit.py jenkins_exploit.py "$HOST:"

      - name: Copy poc6.py to attacker container
        run: |
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker cp poc6.py attacker:/poc6.py'
          ssh -o StrictHostKeyChecking=no "$HOST" 'docker exec attacker chmod +x /poc6.py'

      # - name: Run attack simulation test (ActiveMQ)
